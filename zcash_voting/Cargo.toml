[workspace]
members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
# The default root build is the Zakura application path. LRZ and the
# lower-level VCT packages are validated in separate invocations because their
# backend features are mutually exclusive within one Cargo resolve.
default-members = [
    "zcash_voting",
    "wallet-example",
]
resolver = "2"
exclude = ["browser-deps/rusqlite", "browser-deps/pir-client"]

[workspace.dependencies]
voting-circuits = { version = "=0.11.2", default-features = false }
voting-crypto-deps = { version = "=0.2.2", default-features = false }
zcash_protocol = { version = "0.10.4" }

[profile.test.package.imt-tree]
opt-level = 3

[patch.crates-io]
pczt = { path = "../librustzcash/pczt" }
zcash_client_backend = { path = "../librustzcash/zcash_client_backend" }
zcash_client_sqlite = { path = "../librustzcash/zcash_client_sqlite" }
zcash_keys = { path = "../librustzcash/zcash_keys" }
zcash_primitives = { path = "../librustzcash/zcash_primitives" }
zcash_protocol = { path = "../librustzcash/components/zcash_protocol" }
zcash_transparent = { path = "../librustzcash/zcash_transparent" }

[profile.test.package.valar-ypir]
opt-level = 3

[profile.test.package.valar-spiral-rs]
opt-level = 3
