<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Zcash voting | Testnet</title>
  <style>
    :root {font-family:system-ui,sans-serif;color:#202728;background:#f7f9f8;color-scheme:light;letter-spacing:0}
    * {box-sizing:border-box;min-width:0} body {margin:0} button,input,select {font:inherit}
    header {background:#fff;border-bottom:1px solid #d8e0dc;padding:22px max(24px,calc((100% - 1120px)/2));display:flex;align-items:center;gap:14px}
    header img {width:46px;height:46px} h1 {font-size:25px;margin:0} .tag {color:#287353;font-size:13px;font-weight:650} header .tag {margin-left:auto}
    main {max-width:1168px;margin:auto;padding:0 24px 32px} section {padding:24px 0;border-bottom:1px solid #d8e0dc}
    h2 {font-size:18px;margin:0 0 16px} h3,legend {font-size:15px;font-weight:650;margin:0 0 12px}
    .grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px} .wide {grid-column:span 2}
    label {display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600} input,select {width:100%;height:42px;border:1px solid #aebdb5;border-radius:5px;background:#fff;padding:8px 10px}
    input:focus,select:focus,button:focus-visible {outline:2px solid #287353;outline-offset:2px}
    input:disabled,select:disabled {background:#edf1ee;color:#59645e} .actions {display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
    button {display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 13px;background:#fff;border:1px solid #aebdb5;border-radius:5px;color:#26372e;font-size:13px;font-weight:600;cursor:pointer;overflow-wrap:anywhere}
    button.primary {background:#236447;color:#fff;border-color:#236447} button.danger {color:#a1343a;border-color:#d1a6a9} button:disabled {opacity:.45;cursor:default} button svg,button i {display:block;width:17px;height:17px;flex:none}
    .status {min-height:48px;margin:14px 0 0;line-height:1.6;font-size:13px;overflow-wrap:anywhere;color:#4b5c53} #progress {min-height:76px;white-space:pre-line}
    .rounds {display:grid;grid-template-columns:1fr 1fr;gap:24px}.round {padding:12px 0;border-top:1px solid #e0e6e2}.round p {margin:7px 0;font-size:13px;overflow-wrap:anywhere}.rejected {color:#9b3540}
    fieldset {border:0;border-top:1px solid #e0e6e2;padding:16px 0;margin:12px 0}.choices {display:flex;flex-wrap:wrap;gap:18px}.choices label {flex-direction:row;align-items:center;min-height:32px}.choices input {width:18px;height:18px;accent-color:#236447}
    .empty {font-size:13px;color:#67776e;margin:0;min-height:36px}.metrics {font-variant-numeric:tabular-nums} #operation-status {color:#8a3440} .footer-actions {justify-content:space-between}
    @media(max-width:600px) {header {padding:18px 18px;gap:10px}h1 {font-size:22px}header .tag {font-size:11px}header img {width:38px;height:38px}main {padding:0 18px 24px}section {padding:22px 0}.grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide {grid-column:span 2}.rounds {grid-template-columns:1fr;gap:20px}.actions {gap:8px}button {padding:8px 10px}.footer-actions {justify-content:flex-start}}
  </style>
  <script defer src="./node_modules/lucide/dist/umd/lucide.js"></script>
  <script type="module" src="./voting_page.mjs"></script>
</head>
<body>
  <header><img src="./assets/zcash-mark.svg" alt="Zcash"><h1>Zcash voting</h1><span class="tag">TESTNET / STAGE</span></header>
  <main>
    <section aria-labelledby="wallet-heading">
      <h2 id="wallet-heading">Wallet</h2>
      <div class="grid">
        <label>Network<select id="network" disabled><option value="test">Zcash testnet</option></select></label>
        <label class="wide">Lightwalletd URL<input id="lwd" type="url" value="https://zcash-testnet.chainsafe.dev" spellcheck="false"></label>
        <label>Account index<input id="account-index" type="number" value="0" min="0" max="2147483647" step="1"></label>
        <label class="wide">Mnemonic<input id="mnemonic" type="password" autocomplete="off" spellcheck="false" autocapitalize="off"></label>
        <label>Passphrase<input id="passphrase" type="password" autocomplete="off"></label>
        <label>Birthday height<input id="birthday" type="number" value="3771641" min="1" max="4294967295" step="1"></label>
      </div>
      <div class="actions">
        <button id="initialize" class="primary" data-mutation disabled><i data-lucide="wallet" aria-hidden="true"></i>Initialize wallet</button>
        <button id="sync" data-mutation disabled><i data-lucide="refresh-cw" aria-hidden="true"></i>Sync</button>
        <button id="wallet-refresh" data-mutation disabled><i data-lucide="activity" aria-hidden="true"></i>Status</button>
        <button id="restore" data-mutation disabled><i data-lucide="archive-restore" aria-hidden="true"></i>Restore</button>
      </div>
      <p id="wallet-status" class="status" role="status">Loading voting module...</p>
    </section>
    <section aria-labelledby="rounds-heading">
      <h2 id="rounds-heading">Rounds</h2>
      <div class="rounds"><div><h3>Authenticated</h3><div id="accepted"><p class="empty">No rounds loaded</p></div></div><div><h3>Rejected</h3><div id="rejected"><p class="empty">No rounds loaded</p></div></div></div>
      <div class="actions"><button id="discover" data-mutation disabled><i data-lucide="search" aria-hidden="true"></i>Discover rounds</button></div>
    </section>
    <section aria-labelledby="ballot-heading">
      <h2 id="ballot-heading">Ballot</h2>
      <p id="selected-round" class="empty">No round selected</p>
      <div class="actions">
        <button id="eligibility" data-mutation disabled><i data-lucide="list-checks" aria-hidden="true"></i>Check eligibility</button>
        <button id="prepare" data-mutation disabled><i data-lucide="file-check" aria-hidden="true"></i>Prepare round</button>
        <button id="delegate" data-mutation disabled><i data-lucide="key-round" aria-hidden="true"></i>Submit delegation</button>
      </div>
      <p id="eligibility-status" class="status metrics" role="status">Eligibility pending</p>
      <div id="proposals"></div>
      <div class="actions">
        <button id="vote" class="primary" data-mutation disabled><i data-lucide="vote" aria-hidden="true"></i>Review and submit ballot</button>
        <button id="resume" data-mutation disabled><i data-lucide="play" aria-hidden="true"></i>Resume round</button>
        <button id="round-refresh" data-mutation disabled><i data-lucide="activity" aria-hidden="true"></i>Round status</button>
      </div>
      <p id="progress" class="status" role="status">No active round</p>
    </section>
    <section aria-label="Local state">
      <div class="actions footer-actions">
        <button id="clear-round" class="danger" data-mutation disabled><i data-lucide="eraser" aria-hidden="true"></i>Clear selected round</button>
        <button id="clear" class="danger" data-mutation disabled><i data-lucide="trash-2" aria-hidden="true"></i>Clear local state</button>
        <button id="reload" title="Reload page"><i data-lucide="rotate-cw" aria-hidden="true"></i>Reload</button>
      </div>
      <p id="operation-status" class="status" role="alert"></p>
    </section>
  </main>
</body>
</html>
