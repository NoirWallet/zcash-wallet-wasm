[package]
name = "zcash-wallet-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "-O4", "--enable-threads", "--enable-bulk-memory", "--enable-simd", "--enable-mutable-globals"]

[features]
default = ["wasm-parallel"]
multicore = ["zcash_proofs/multicore", "zcash_primitives/multicore", "zcash_client_memory/multicore", "orchard/multicore"]
wasm-parallel = ["wasm-bindgen-rayon", "multicore"]

[dependencies]
wasm-bindgen = { version = "0.2" }
js-sys = "0.3.77"


serde-wasm-bindgen = "0.6.5"

wasm-bindgen-futures = "0.4.43"
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1.8", features = ["web_spin_lock"] }

tracing-web = { version = "0.1.3" }
console_error_panic_hook = { version = "0.1.7" }
tonic-web-wasm-client = "0.7.0"
tokio_with_wasm = { version = "0.7.1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

zcash_keys = { git = "https://github.com/rhea-finance/librustzcash.git", rev = "521e238af52263dc65a9f4362167f7a7e31ae992", features = ["transparent-inputs", "orchard", "sapling", "unstable"] }
zcash_client_backend = { git = "https://github.com/rhea-finance/librustzcash.git", rev = "521e238af52263dc65a9f4362167f7a7e31ae992", default-features = false, features = ["sync", "lightwalletd-tonic", "orchard", "pczt", "wasm-bindgen"] }
zcash_client_memory = { git = "https://github.com/rhea-finance/librustzcash.git", rev = "521e238af52263dc65a9f4362167f7a7e31ae992", default-features = false, features = ["orchard", "transparent-inputs", "multicore"] }
zcash_primitives = { git = "https://github.com/rhea-finance/librustzcash.git", rev = "521e238af52263dc65a9f4362167f7a7e31ae992", default-features = false, features = ["std", "multicore"] }
zcash_address = { git = "https://github.com/rhea-finance/librustzcash.git", rev = "521e238af52263dc65a9f4362167f7a7e31ae992" }
zcash_proofs = { git = "https://github.com/rhea-finance/librustzcash.git", rev = "521e238af52263dc65a9f4362167f7a7e31ae992", default-features = false, features = ["bundled-prover", "multicore"] }
zcash_protocol = { git = "https://github.com/rhea-finance/librustzcash.git", rev = "521e238af52263dc65a9f4362167f7a7e31ae992", default-features = false }
pczt = { git = "https://github.com/rhea-finance/librustzcash.git", rev = "521e238af52263dc65a9f4362167f7a7e31ae992", default-features = false, features = ["orchard", "sapling", "transparent"] }
zip321 = { git = "https://github.com/rhea-finance/librustzcash.git", rev = "521e238af52263dc65a9f4362167f7a7e31ae992" }

zip32 = { version = "0.2" }

sapling = { package = "sapling-crypto", version = "0.5", default-features = false }
orchard = { version = "0.11", default-features = false, features = ["circuit", "multicore"] }

getrandom = { version = "0.2", features = ["js"] }

thiserror = "2"

bip0039 = "0.12.0"
secrecy = "0.8.0"
nonempty = "0.11"
secp256k1 = { version = "0.27", features = ["recovery", "global-context"] }
bitcoin_hashes = "0.13"
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
sha2 = "0.10"

tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing = "0.1.40"

serde = { version = "1", features = ["derive"], default-features = false }
subtle = "2.6.1"
tokio = { version = "1.0", features = ["rt", "macros"] }

age = "0.11"

tonic = { version = "0.13", default-features = false, features = [
    "prost",
    "codegen",
] }

gloo-net = "0.6.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'abort'
strip = true