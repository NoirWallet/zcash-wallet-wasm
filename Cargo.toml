[package]
name = "zcash-wallet-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "-O4", "--enable-threads", "--enable-bulk-memory", "--enable-simd", "--enable-mutable-globals", "--enable-nontrapping-float-to-int"]

[features]
default = ["wasm-parallel"]
multicore = ["zcash_proofs/multicore", "zcash_primitives/multicore", "zcash_client_memory/multicore", "orchard/multicore"]
wasm-parallel = ["wasm-bindgen-rayon", "multicore"]
voting = ["dep:zcash_voting"]

[dependencies.zcash_voting]
path = "./zcash_voting/zcash_voting"
default-features = false
features = ["lrz", "browser"]
optional = true

[dependencies]
wasm-bindgen = { version = "0.2" }
js-sys = "0.3.77"


serde-wasm-bindgen = "0.6.5"

wasm-bindgen-futures = "0.4.43"
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1.8", features = ["web_spin_lock"] }

tracing-web = { version = "0.1.3" }
console_error_panic_hook = { version = "0.1.7" }
tonic-web-wasm-client = "0.8.0"
tokio_with_wasm = { version = "0.7.1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

zcash_keys = { path = "./librustzcash/zcash_keys", features = ["transparent-inputs", "orchard", "sapling", "unstable"] }
zcash_client_backend = { path = "./librustzcash/zcash_client_backend", default-features = false, features = ["sync", "lightwalletd-tonic", "orchard", "pczt", "non-standard-fees"] }
zcash_client_memory = { path = "./librustzcash/zcash_client_memory", default-features = false, features = ["orchard", "transparent-inputs", "multicore"] }
zcash_primitives = { path = "./librustzcash/zcash_primitives", default-features = false, features = ["std", "multicore", "non-standard-fees"] }
zcash_address = { path = "./librustzcash/components/zcash_address" }
zcash_proofs = { path = "./librustzcash/zcash_proofs", default-features = false, features = ["bundled-prover", "multicore"] }
zcash_protocol = { path = "./librustzcash/components/zcash_protocol", default-features = false }
transparent = { package = "zcash_transparent", path = "./librustzcash/zcash_transparent", default-features = false, features = ["transparent-inputs"] }
pczt = { path = "./librustzcash/pczt", default-features = false, features = ["orchard", "sapling", "transparent"] }
zip321 = { path = "./librustzcash/components/zip321" }

zip32 = { version = "0.2" }

sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
orchard = { version = "=0.15.5", default-features = false, features = ["circuit", "multicore"] }

getrandom = { version = "0.2", features = ["js"] }

thiserror = "2"
time = { version = "0.3.22", default-features = false, features = ["wasm-bindgen"] }

bip0039 = "0.12.0"
secrecy = "0.8.0"
nonempty = "0.11"
secp256k1 = { version = "0.27", features = ["recovery", "global-context"] }
bitcoin_hashes = "0.13"
hex = "0.4"
bs58 = "0.5"
sha2 = "0.10"

tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing = "0.1.40"

serde = { version = "1", features = ["derive"], default-features = false }
subtle = "2.6.1"
tokio = { version = "1.0", features = ["rt", "macros"] }

age = "0.11"

tonic = { version = "0.14", default-features = false, features = [
    "codegen",
] }

prost = "0.14"
futures-util = "0.3"

[dev-dependencies]
rand_core = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'abort'
strip = true

[patch.crates-io]
pczt = { path = "./librustzcash/pczt" }
zcash_client_backend = { path = "./librustzcash/zcash_client_backend" }
zcash_client_sqlite = { path = "./librustzcash/zcash_client_sqlite" }
zcash_keys = { path = "./librustzcash/zcash_keys" }
zcash_primitives = { path = "./librustzcash/zcash_primitives" }
zcash_protocol = { path = "./librustzcash/components/zcash_protocol" }
zcash_transparent = { path = "./librustzcash/zcash_transparent" }
