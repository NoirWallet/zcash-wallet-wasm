[package]
name = "zcash-wallet-wasm"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "-O4", "--enable-threads", "--enable-bulk-memory", "--enable-simd", "--enable-mutable-globals", "--enable-nontrapping-float-to-int"]

[features]
default = ["wasm-parallel"]
multicore = ["zcash_proofs/multicore", "zcash_primitives/multicore", "zcash_client_memory/multicore", "orchard/multicore"]
wasm-parallel = ["wasm-bindgen-rayon", "multicore"]
voting = ["dep:zcash_voting", "dep:futures-channel", "dep:web-sys", "dep:base64", "dep:rand_core"]
voting-test-fixtures = ["voting", "zcash_voting/test-fixtures"]

[dependencies.zcash_voting]
path = "./zcash_voting/zcash_voting"
default-features = false
features = ["lrz", "browser"]
optional = true

[dependencies]
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }
rand = { version = "0.10", features = ["sys_rng"] }
serde_json = "1"
base64 = { version = "0.22", optional = true }
wasm-bindgen = { version = "0.2" }
js-sys = "0.3.77"


serde-wasm-bindgen = "0.6.5"

wasm-bindgen-futures = "0.4.43"
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1.8", features = ["web_spin_lock"] }

tracing-web = { version = "0.1.3" }
console_error_panic_hook = { version = "0.1.7" }
tonic-web-wasm-client = { package = "tonic-web-wasm-client-compat", path = "crates/tonic-web-wasm-client" }
tokio_with_wasm = { version = "0.7.1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

zcash_keys = { path = "./librustzcash/zcash_keys", features = ["transparent-inputs", "orchard", "sapling", "unstable"] }
zcash_client_backend = { path = "./librustzcash/zcash_client_backend", default-features = false, features = ["sync", "lightwalletd-tonic", "orchard", "pczt", "non-standard-fees"] }
zcash_client_memory = { path = "./librustzcash/zcash_client_memory", default-features = false, features = ["orchard", "transparent-inputs"] }
zcash_primitives = { path = "./librustzcash/zcash_primitives", default-features = false, features = ["std", "non-standard-fees"] }
zcash_address = { path = "./librustzcash/components/zcash_address" }
zcash_proofs = { path = "./librustzcash/zcash_proofs", default-features = false, features = ["bundled-prover"] }
zcash_protocol = { path = "./librustzcash/components/zcash_protocol", default-features = false }
transparent = { package = "zcash_transparent", path = "./librustzcash/zcash_transparent", default-features = false, features = ["transparent-inputs"] }
pczt = { path = "./librustzcash/pczt", default-features = false, features = ["orchard", "sapling", "transparent"] }
zip321 = { path = "./librustzcash/components/zip321" }

zip32 = { version = "0.3" }

sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
orchard = { version = "0.16", default-features = false, features = ["circuit"] }

getrandom = { version = "0.2", features = ["js"] }

thiserror = "2"
time = { version = "0.3.22", default-features = false, features = ["wasm-bindgen"] }

bip0039 = "0.12.0"
secrecy = "0.8.0"
nonempty = "0.11"
secp256k1 = { version = "0.33", features = ["recovery", "global-context"] }
bitcoin_hashes = "0.13"
hex = "0.4"
bs58 = "0.5"
sha2 = "0.10"
ff = "0.14"
zcash_script = { version = "0.6", default-features = false }

tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing = "0.1.40"

serde = { version = "1", features = ["derive"], default-features = false }
subtle = "2.6.1"
tokio = { version = "1.0", features = ["rt", "macros", "time"] }

age = "0.11"

tonic = { version = "0.14", default-features = false, features = [
    "codegen",
] }

prost = "0.14"
futures-util = "0.3"
async-trait = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
futures-channel = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "AbortController", "AbortSignal", "Headers", "Request", "RequestInit",
    "RequestCredentials", "RequestMode", "RequestRedirect", "Response", "Window",
] }

[dev-dependencies]
rand_core = "0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zcash_voting = { path = "./zcash_voting/zcash_voting", default-features = false, features = ["lrz", "browser", "test-fixtures"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "serialize"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = 'abort'
strip = true

[patch.crates-io]
voting-crypto-deps = { path = "./zcash_voting/browser-deps/voting-crypto-deps" }
pczt = { path = "./librustzcash/pczt" }
zcash_client_backend = { path = "./librustzcash/zcash_client_backend" }
zcash_client_sqlite = { path = "./librustzcash/zcash_client_sqlite" }
zcash_keys = { path = "./librustzcash/zcash_keys" }
zcash_primitives = { path = "./librustzcash/zcash_primitives" }
zcash_protocol = { path = "./librustzcash/components/zcash_protocol" }
zcash_transparent = { path = "./librustzcash/zcash_transparent" }
