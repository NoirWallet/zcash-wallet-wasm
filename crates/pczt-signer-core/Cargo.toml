[package]
name = "pczt-signer-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Independent PCZT verification and signature material for the FROST Secure Vault signer"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
frost-vault-core = { path = "../frost-vault-core" }
# `orchard` without `circuit`: the signer verifies, it never proves.
# No builder/prover features here either — a signer that can construct transactions can be talked
# into constructing the wrong one, so the ability simply is not linked.
pczt = { path = "../../librustzcash/pczt", default-features = false, features = ["std", "orchard", "signer"] }
zcash_protocol = { path = "../../librustzcash/components/zcash_protocol", default-features = false }
# Needed only to name `orchard::ValuePool` when building a `SpendAuthSignature`; still no circuit.
orchard = { version = "0.16", default-features = false, features = ["std"] }

[dev-dependencies]
# Test-only: build one real Ironwood PCZT to run the flow end to end. These features stay out of
# the library build.
# Two RNG lines on purpose: librustzcash in this tree is on rand_core 0.10, while FROST
# (via reddsa 0.5) is on rand_core 0.6. Both must be wired explicitly.
rand = { version = "0.10", features = ["sys_rng"] }
rand08 = { package = "rand", version = "0.8" }
ff = "0.14"
zcash_primitives = { path = "../../librustzcash/zcash_primitives", default-features = false, features = ["std"] }
pczt = { path = "../../librustzcash/pczt", default-features = false, features = ["std", "orchard", "signer", "zcp-builder", "io-finalizer"] }

[dev-dependencies.hex]
version = "0.4"
