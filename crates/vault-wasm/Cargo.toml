[package]
name = "vault-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "JS bindings for the FROST Secure Vault protocol"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Synthetic PCZT construction, for the JS test harness only. Off by default: it links the transaction
# builder, which production does not need here (the wallet has its own).
test-fixtures = ["dep:vault-fixtures"]

[dependencies]
frost-vault-core = { path = "../frost-vault-core" }
vault-keyset = { path = "../vault-keyset" }
vault-deposit = { path = "../vault-deposit" }
# PCZT handling without the prover: strip, read, apply. `vault-pczt` is deliberately not a dep — it
# links Halo2, and the frontend gets proving from the wallet's existing path.
pczt-signer-core = { path = "../pczt-signer-core" }
pczt = { path = "../../librustzcash/pczt", default-features = false, features = ["std", "orchard", "signer"] }
# Only for the address sanity check and the network enum.
zcash_address = { path = "../../librustzcash/components/zcash_address" }
orchard = { version = "0.16", default-features = false, features = ["std"] }
zcash_protocol = { path = "../../librustzcash/components/zcash_protocol", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
# FROST (via reddsa 0.5) takes rand_core 0.6 RNGs, not the rand_core 0.10 that librustzcash uses.
# `getrandom 0.2` with `js` is what backs `rand_core::OsRng` in the browser; the alias keeps the
# version explicit because the tree has several.
rand_core = { version = "0.6", features = ["getrandom"] }
rand = { version = "0.10", features = ["sys_rng"], optional = false }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
# rand 0.10 pulls getrandom 0.4, whose wasm backend needs to be selected explicitly.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dependencies.vault-fixtures]
path = "../vault-fixtures"
optional = true
