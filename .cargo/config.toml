# Enable atomics and bulk-memory for wasm-bindgen-rayon
# Enable SIMD for performance (simd128 + relaxed-simd)
[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals,+simd128,+relaxed-simd",
    "-C", "link-arg=--max-memory=4294967296",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--import-memory",
    # Thread ABI consumed by wasm-bindgen 0.2.122 with the pinned Rust linker.
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__heap_base",
    "-C", "link-arg=--export=__tls_base",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
]

[build]
target = "wasm32-unknown-unknown"

[env]
# C objects must support the same shared-memory target as Rust. SQLite remains
# single-threaded and owned by the JS-thread session.
CFLAGS_wasm32_unknown_unknown = "-matomics -mbulk-memory"

[unstable]
build-std = ["panic_abort", "std"]
